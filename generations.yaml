generations:
  - name: "First Generation (2012-2016)"
    start_year: 2012
    end_year: 2016
    description: "The original Tesla Model S (2012-2016) represented a watershed moment for electric vehicles, being the first purpose-built EV from the company and establishing a new benchmark for long-range, high-performance electric motoring. Designed from the ground up as an electric vehicle rather than a conversion of an existing platform, the Model S featured a distinctive fastback sedan profile with clean, aerodynamic styling achieving a remarkably low 0.24 drag coefficient. The aluminum-intensive body structure housed a floor-mounted battery pack (available in 60, 70, 85, or 90 kWh capacities) providing ranges from approximately 208 to 270 miles—unprecedented for production EVs of the era. The AC induction motor in base models produced 362 hp, with performance variants including the P85 and P85D delivering supercar-rivaling acceleration. Early models featured a minimalist interior centered around a pioneering 17-inch vertical touchscreen controlling most vehicle functions. Distinctive features included an available third-row rear-facing jump seat for children, a front trunk ('frunk') providing additional storage, and over-the-air software updates—a revolutionary concept in the automotive industry at the time. Tesla's proprietary Supercharger network, launched alongside the Model S, addressed the critical issue of long-distance travel for EVs. The first-generation Model S received numerous updates throughout its production, including the introduction of dual-motor all-wheel drive ('D' variants) in 2014 with the P85D, and Autopilot driver assistance technology. The vehicle earned unprecedented acclaim, including Motor Trend's 2013 Car of the Year award and the highest score ever recorded by Consumer Reports at the time, while establishing Tesla as a significant player in the premium automotive market."

  - name: "First Generation (2016-2019 Facelift)"
    start_year: 2016
    end_year: 2019
    description: "The facelifted Tesla Model S introduced in 2016 featured significant visual and technological updates while maintaining the same fundamental platform. The most obvious exterior change was the elimination of the faux grille, replaced with a smoother nose section more similar to the Model X, along with revised headlights and minor rear styling tweaks. Interior updates included new front seats and additional finish choices. Technical improvements encompassed a new HEPA air filtration system, faster charging capabilities, and improved standard equipment. During this period (2016-2019), Tesla continually enhanced the Model S with more efficient electric motors, improved battery management for increased range, and enhanced Autopilot hardware. Battery capacities were rationalized to 75 and 100 kWh variants, with the P90D continuing to offer extreme performance. The cabin technology received regular updates through over-the-air software improvements. The dual-motor P100D achieved 0-60 mph acceleration in approximately 2.4 seconds with Ludicrous Plus mode. While maintaining its position as Tesla's flagship sedan, this generation of Model S faced increasing competition from Tesla's own more affordable Model 3 and other premium electric vehicles."

  - name: "First Generation (2019-2021 Simplified Naming)"
    start_year: 2019
    end_year: 2021
    description: "In mid-2019, Tesla streamlined its Model S lineup by replacing the previous 75D, 100D, and P100D models with Standard Range, Long Range, and Performance models. This represented a simplification of nomenclature while continuing the same fundamental platform architecture. The Long Range variant featured a 100 kWh battery with dual motors generating 469 hp and 730 Nm of torque, providing up to 375 miles of range. The Performance variant produced 754 hp and 687 lb-ft of torque with the same 100 kWh battery and a range of 365 miles. A new motor technology was introduced for dual-motor models: a permanent magnet synchronous reluctance motor at the front and an AC induction motor at the rear, improving efficiency by approximately ten percent. For 2020, the Long Range Plus model was introduced with 100 kWh battery, dual motors producing 417 hp and 485 lb-ft of torque, and an EPA-rated range of 400 miles. This period maintained the original interior design philosophy with the portrait-oriented 17-inch touchscreen before the comprehensive redesign of 2021."

  - name: "Second Generation (2021-Present Redesign)"
    start_year: 2021
    end_year: null
    description: "The 2021 redesign of the Tesla Model S represents the most comprehensive update to the vehicle since its introduction, featuring an entirely new interior architecture and the introduction of the high-performance Plaid variant. Exterior changes were relatively subtle with minimal alterations to the car's distinctive silhouette. The interior received a dramatic overhaul, replacing the portrait 17-inch touchscreen with a new landscape-oriented 17-inch display, eliminating the traditional gear selector in favor of automatic gear selection via touchscreen controls, and introducing a 'yoke' steering wheel design lacking a conventional rim (though a conventional wheel became optional later). Performance saw revolutionary advances with the tri-motor Plaid variant, producing 1,020 horsepower and achieving 0-60 mph acceleration in under 2 seconds with rollout—making it among the quickest production cars ever made regardless of powertrain type. The Plaid achieved 359 miles EPA range despite its extreme performance focus. The standard dual-motor Long Range variant achieved up to 405 miles EPA range. Technical updates included a new heat pump climate system for improved efficiency in cold weather and completely revised computing hardware powering the infotainment and driver assistance systems. A Plaid+ variant with 520+ miles of range was announced but canceled before production. The second-generation Model S maintains Tesla's position at the forefront of electric vehicle performance and technology, with all-wheel drive standard across configurations and access to Full Self-Driving capability."
